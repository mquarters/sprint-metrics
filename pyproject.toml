[project]
name = "sprint-metrics"
version = "0.0.0"
description = "Delivery metrics for the crew's own board."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
sprint-metrics = "sprint_metrics.crew_performance:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sprint_metrics"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Pinned explicitly. Left unset, the effective rule set is whatever this
# version of ruff happens to default to — which changed under us: 0.16
# enables flake8-datetimez, so `date.today()` began failing lint and two
# stories were blocked by a rule nobody had chosen.
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
